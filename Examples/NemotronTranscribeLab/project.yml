name: NemotronTranscribeLab
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NativSDK:
    path: ../..
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.33.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  NemotronTranscribeLab:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: NativSDK
        product: NativSDK
      - package: MLX
        product: MLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.neywalabs.nemotron-transcribe-lab
        PRODUCT_NAME: NemotronTranscribeLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nemotron Audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio to process entirely on your device.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: NemotronTranscribeLab.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
schemes:
  NemotronTranscribeLab:
    build:
      targets:
        NemotronTranscribeLab: all
    run:
      config: Release
